version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: escalight
    main: .
    binary: escalight
    env:
      - CGO_ENABLED=0 # pure-Go SQLite driver: no cgo toolchain needed for any target
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/Laaaaksh/escalight/internal/version.Version={{.Version}}

archives:
  - id: escalight
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true # release notes come from CHANGELOG.md, see scripts/release_notes.sh

release:
  draft: false
