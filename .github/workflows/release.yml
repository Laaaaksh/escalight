name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# A release run must never be cancelled mid-publish (assets/images can end up
# half-shipped), so overlapping runs queue instead: cancel-in-progress stays
# unset. Distinct tags are distinct refs and never share a group anyway; the
# guard covers the delete-and-re-push-same-tag race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          scripts/release_notes.sh "$RUNNER_TEMP/release-notes.md" "${GITHUB_REF_NAME#v}"
          echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned so tagged releases cannot be broken by a future upstream
          # release that removes a deprecated feature; bump deliberately.
          version: v2.18.0
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.3.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${{ github.repository }}:${version},ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
